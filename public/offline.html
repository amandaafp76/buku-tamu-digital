<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Offline - Buku Tamu Digital</title>

    <meta name="theme-color" content="#9A3F3F">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                'Helvetica Neue', Arial, sans-serif;
            color: #1f2937;
            background: linear-gradient(135deg, #f5f5f7 0%, #e5e7eb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 440px;
            width: 100%;
            text-align: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 28px;
            padding: 40px 28px;
            box-shadow:
                0 1px 2px rgba(0, 0, 0, 0.04),
                0 20px 40px rgba(0, 0, 0, 0.08);
        }

        .icon-wrapper {
            width: 88px;
            height: 88px;
            margin: 0 auto 24px;
            border-radius: 24px;
            background: rgba(154, 63, 63, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-wrapper svg {
            width: 44px;
            height: 44px;
            stroke: #9A3F3F;
            stroke-width: 1.75;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #111827;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .hint {
            font-size: 13px;
            color: #9ca3af;
            margin-top: 20px;
            margin-bottom: 24px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 28px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 20px;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            font-family: inherit;
            min-height: 48px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: #9A3F3F;
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(154, 63, 63, 0.25);
        }

        .btn-primary:hover {
            box-shadow: 0 10px 24px rgba(154, 63, 63, 0.35);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.9);
            color: #374151;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .btn-secondary:hover {
            background: #ffffff;
        }

        @media (min-width: 480px) {
            .actions {
                flex-direction: row;
                justify-content: center;
            }

            .btn {
                flex: 1;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="glass-card">

            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M1 1l22 22"></path>
                    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                    <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
            </div>

            <h1>Anda Sedang Offline</h1>

            <p>
                Koneksi internet tidak tersedia saat ini.
            </p>

            <p class="hint">
                Halaman yang pernah Anda buka masih bisa diakses.
                Halaman baru akan tersedia setelah koneksi kembali.
            </p>

            <div class="actions">
                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="location.reload()">

                    Coba Lagi
                </button>

                <a
                    href="/bukutamu-masuk"
                    class="btn btn-secondary">

                    Ke Halaman Login
                </a>
            </div>

        </div>

    </div>

</body>

</html>
